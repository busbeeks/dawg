<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a Gym in Singapore — KAHLID</title>
  <meta name="description" content="Find a gym near you in Singapore. Search by name or area and filter by region, with prices, hours and map links.">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <header class="page-hero">
    <div class="container">
      <p class="breadcrumb-mini"><a href="../index.html">Home</a> / Workouts / Find a Gym</p>
      <h1 class="mt-3">Find a Gym <span class="text-orange">Near You</span></h1>
      <p class="lead-lg mt-3">Gyms across Singapore — search by name or neighbourhood, filter by region, and open directions in one tap.</p>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="row g-3 align-items-end mb-4">
        <div class="col-lg-5">
          <label class="form-label" for="gymSearch">Search gyms</label>
          <input type="search" class="form-control" id="gymSearch" placeholder="Try 'Tampines' or 'Anytime'…">
        </div>
        <div class="col-lg-7">
          <label class="form-label d-block">Region</label>
          <div class="d-flex flex-wrap gap-2">
            <button class="chip active" data-region="all">All</button>
            <button class="chip" data-region="central">Central</button>
            <button class="chip" data-region="east">East</button>
            <button class="chip" data-region="west">West</button>
            <button class="chip" data-region="north">North</button>
          </div>
        </div>
      </div>
      <p class="text-muted-soft" id="gymCount"></p>
      <div class="row g-4" id="gymGrid"></div>

      <div class="mt-5">
        <h2 class="fs-1-8 mb-3">Map of Singapore</h2>
        <iframe class="map-embed" title="Map of gyms in Singapore" loading="lazy" src="https://www.google.com/maps?q=gyms%20in%20singapore&output=embed"></iframe>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/find-gym.js"></script>
</body>
</html>
